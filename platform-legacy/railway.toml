[phases.setup]
nixPkgs = ["nodejs_22", "python3"]
aptPkgs = ["build-essential", "libudev-dev", "libssl-dev"]

[phases.install]
cmds = ["npm install -g pnpm@9 && pnpm install --frozen-lockfile"]

[phases.build]
cmds = ["pnpm run db:generate && pnpm run build"]

[start]
cmd = "node apps/backend/dist/main.js"

[healthcheck]
path = "/health"
timeout = 30
